name: Windows build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-boost
          mingw-w64-ucrt-x86_64-xz
          mingw-w64-ucrt-x86_64-zlib
    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWERROR=OFF -DUSE_LTO=OFF
    - name: Build
      run: cmake --build build
    - name: Locate binary
      run: ls -la build/*.exe
    - uses: actions/upload-artifact@v4
      with:
        name: innoextract-windows
        path: build/innoextract.exe
